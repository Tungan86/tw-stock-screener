name: 台股大師多頭量化選股與同步 (Daily Stock Screener)

on:
  schedule:
    # 台灣時間 (UTC+8) 週一至週五 下午 15:30 執行
    # 對應 UTC 時間 07:30 (30 7 * * 1-5)
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊「Run workflow」隨時觸發

jobs:
  screen-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: 1. 檢出專案代碼 (Checkout repository)
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. 安裝依賴套件 (Install dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 建立服務帳號憑證與環境變數 (Restore Credentials & Env)
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 寫入 Google 服務帳號金鑰並驗證
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "$SERVICE_ACCOUNT_JSON" > service_account.json
            python -c "import json; data=json.load(open('service_account.json')); assert 'client_email' in data, 'Invalid key format'; print('✅ Google 服務帳號金鑰載入成功:', data['client_email'])" || echo "::warning title=Invalid Service Account::GCP_SERVICE_ACCOUNT_JSON 解析失敗，請檢查 GitHub Secret 內容是否為完整 JSON"
          else
            echo "::warning title=Missing Service Account::GitHub Secrets 未設定 GCP_SERVICE_ACCOUNT_JSON"
          fi
          
          # 建立 .env 設定檔
          echo "SERVICE_ACCOUNT_FILE=service_account.json" > .env
          echo "GOOGLE_SHEET_ID=$GOOGLE_SHEET_ID" >> .env
          echo "GOOGLE_SHEET_TITLE=台股大師多頭選股監控表" >> .env
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "GEMINI_MODEL=gemini-3.1-flash-lite" >> .env
          echo "MIN_PRICE=10.0" >> .env
          echo "MIN_VOLUME_SHARES=500000" >> .env
          echo "MIN_RSI=50.0" >> .env
          echo "MIN_DIST_52W_LOW_PCT=0.25" >> .env
          echo "MAX_DIST_52W_HIGH_PCT=0.25" >> .env
          echo "MA200_TREND_LOOKBACK_DAYS=20" >> .env
          echo "LOG_LEVEL=INFO" >> .env

      - name: 5. 執行台股大師多頭量化選股與戰情看板產出 (Run Stock Screener & Dashboard)
        run: |
          python main.py

      - name: 6. 歸檔本機產出結果 (Upload Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screener-output-${{ github.run_id }}
          path: |
            output/*.csv
            output/index.html
            data/archive/*.parquet
          retention-days: 14

      - name: 7. 自動提交並推送最新戰情看板與股票清單至 GitHub Pages (Deploy Docs & Sync Registry)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/tw_stocks_registry.json
          git commit -m "chore: 自動更新每日交易員戰情看板與股票清單 [skip ci]" || echo "No changes to commit"
          git push origin main
